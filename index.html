<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Partecipazione di Nozze</title>
    <meta
      name="description"
      content="Siamo felici di invitarti al nostro matrimonio."
    />
    <meta name="theme-color" content="#0f1a17" />

    <!-- Evento privato: fuori dai motori di ricerca -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!-- Anteprima su WhatsApp / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ti invitiamo al nostro matrimonio" />
    <meta
      property="og:description"
      content="Tira il fiocco per aprire la partecipazione."
    />
    <meta property="og:image" content="assets/preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Cinzel:wght@400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
    <!-- Dopo ogni modifica a css/js: alza ?v= di 1 per bypassare la cache (GitHub Pages usa max-age=600) -->
    <link rel="stylesheet" href="assets/style.css?v=12" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="petals" aria-hidden="true"></canvas>

    <!-- ============ SCENA 1: BUSTA A SCHERMO INTERO ============ -->
    <section id="scena-busta" class="scena">
      <div class="busta-full" id="bustaFull">
        <!-- Pieghe della busta: linee che convergono verso il sigillo,
             come sul retro di una busta reale vista da vicino. -->
        <svg class="busta-pieghe" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0 0 L50 40 M100 0 L50 40 M0 100 L50 40 M100 100 L50 40" />
        </svg>

        <button class="wax" id="sigillo" type="button" aria-label="Tocca per aprire l'invito">
          <!-- Forma della cera: bordo irregolare ottenuto deformando un cerchio
               con rumore/filtro SVG, non un cerchio perfetto -> effetto colata reale. -->
          <svg class="wax-forma" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <filter id="ceralaccaBordo" x="-30%" y="-30%" width="160%" height="160%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="rumore" />
                <feDisplacementMap in="SourceGraphic" in2="rumore" scale="8" xChannelSelector="R" yChannelSelector="G" />
              </filter>
              <radialGradient id="ceralaccaColore" cx="34%" cy="26%" r="78%">
                <stop offset="0%" stop-color="#3d7d5b" />
                <stop offset="45%" stop-color="#1e4933" />
                <stop offset="100%" stop-color="#0a2016" />
              </radialGradient>
              <radialGradient id="ceralaccaLucido" cx="32%" cy="22%" r="34%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity=".5" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
              </radialGradient>
            </defs>
            <ellipse cx="63" cy="70" rx="8" ry="15" fill="url(#ceralaccaColore)" filter="url(#ceralaccaBordo)" opacity=".85" />
            <circle cx="60" cy="56" r="43" fill="url(#ceralaccaColore)" filter="url(#ceralaccaBordo)" />
            <circle cx="60" cy="56" r="43" fill="url(#ceralaccaLucido)" filter="url(#ceralaccaBordo)" />
          </svg>
          <svg class="wax-anello" viewBox="0 0 80 80" aria-hidden="true">
            <circle cx="40" cy="40" r="29" />
            <circle cx="40" cy="40" r="23" />
            <g class="wax-perle">
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(69,40) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(60.5,60.5) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(40,69) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(19.5,60.5) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(11,40) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(19.5,19.5) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(40,11) rotate(45)" />
              <rect x="-2.2" y="-2.2" width="4.4" height="4.4" transform="translate(60.5,19.5) rotate(45)" />
            </g>
          </svg>
          <span class="wax-iniziali script" id="sigilloIniziali">G&amp;T</span>
        </button>

        <!-- Vignetta scura dietro nome e pillola: senza, il bianco si perde
             sulla carta rosa chiaro. -->
        <div class="busta-vignetta" aria-hidden="true"></div>

        <p class="script busta-nomi" id="bustaNomi">Gaetano &amp; Tiziana</p>
        <button class="pill-apri" id="bustaCta" type="button">Tocca per aprire</button>
      </div>
    </section>

    <!-- ============ SCENA 2: INVITO ============ -->
    <main id="invito" class="invito" hidden>
      <header class="hero">
        <p class="occhiello" id="salutoTop">Gentili ospiti</p>
        <p class="mono">insieme alle loro famiglie</p>
        <h1 class="script">
          <span id="nomeSposo">Gaetano</span><em>&amp;</em
          ><span id="nomeSposa">Tiziana</span>
        </h1>
        <span class="rule" aria-hidden="true"></span>
        <p class="lead">
          hanno il piacere di invitarvi<br />al loro matrimonio
        </p>
        <p class="data-big">
          <span id="dataTesto">Sabato 12 Giugno 2027</span><br /><small
            id="oraTesto"
            >ore 16:30</small
          >
        </p>
        <p class="posti" id="posti" hidden></p>
        <p class="msg-personale" id="msgPersonale" hidden></p>
        <div class="scroll-cue" aria-hidden="true"><span></span></div>
      </header>

      <section class="blocco reveal" id="countdownBox">
        <h3 class="titolo">Manca poco</h3>
        <div
          class="countdown"
          id="countdown"
          role="timer"
          aria-live="off"
        ></div>
      </section>

      <section class="blocco reveal">
        <h3 class="titolo">Dove e quando</h3>
        <div class="luoghi">
          <article class="luogo" id="luogoCerimonia"></article>
          <article class="luogo" id="luogoRicevimento"></article>
        </div>
      </section>

      <!-- Sospeso su richiesta: sezione "Il programma" (orari dettagliati).
           Dati ancora in config.js -> W.programma, pronta a essere riattivata.
      <section class="blocco reveal">
        <h3 class="titolo">Il programma</h3>
        <ol class="timeline" id="timeline"></ol>
      </section>
      -->

      <!-- Sospeso su richiesta: sezione "Dress code".
           Dato ancora in config.js -> W.dressCode, pronto a essere riattivato.
      <section class="blocco reveal" id="dressBox">
        <h3 class="titolo">Dress code</h3>
        <p class="testo" id="dressCode"></p>
      </section>
      -->

      <section class="blocco reveal" id="regaloBox">
        <h3 class="titolo">Un pensiero</h3>
        <p class="testo" id="regaloTesto"></p>
        <p class="iban">
          <code id="regaloIban"></code>
          <button class="btn-ghost" id="copiaIban" type="button">
            Copia IBAN
          </button>
        </p>
        <p class="testo piccolo" id="regaloIntestatario"></p>
      </section>

      <section class="blocco reveal rsvp">
        <h3 class="titolo">Confermi la tua presenza?</h3>
        <p class="testo">
          Facci sapere entro il <strong id="rsvpEntro"></strong>.
        </p>
        <div class="azioni">
          <a class="btn" id="btnSi" href="#">Ci sarò</a>
          <a class="btn btn-secondario" id="btnNo" href="#"
            >Non potrò esserci</a
          >
        </div>
        <div class="azioni">
          <button class="btn-ghost" id="btnCal" type="button">
            Aggiungi al calendario
          </button>
        </div>
      </section>

      <footer class="chiusura reveal">
        <span class="rule" aria-hidden="true"></span>
        <p class="script grande" id="firmaSposi">Tiziana &amp; Gaetano</p>
        <p class="mono" id="hashtag"></p>
      </footer>

      <aside class="credito reveal" id="credito" hidden></aside>
    </main>

    <script src="assets/config.js?v=12"></script>
    <script src="assets/app.js?v=12"></script>
  </body>
</html>
